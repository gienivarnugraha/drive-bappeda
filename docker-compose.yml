version: '3.8'

services:
  nuxt_app:
    # This tells Docker Compose to build the image using the Dockerfile in the current directory
    build:
      context: .
      dockerfile: Dockerfile

    # Map port 8080 inside the container to port 3000 on the host machine
    ports:
      - "8080:3000"

    # Set the critical environment variable for Nuxt's Nitro server
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - SITE_URL=${SITE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD}

    # --- Healthcheck Definition ---
    healthcheck:
      # Command to run: Check if the application's URL is accessible
      # The `curl` command ensures the web server is responding with a 2xx or 3xx status code.
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      
      # How often to run the check
      interval: 30s
      
      # How long to wait for a response before the check fails
      timeout: 10s
      
      # The number of consecutive failures needed to consider the container 'unhealthy'
      retries: 3
      
      # The duration to wait before starting the first healthcheck
      start_period: 20s
    # Define the persistent storage volumes
    # This is how you persist files that your Nuxt server generates (e.g., file uploads)
    volumes:
      # Named volume: 'nuxt-storage' is the volume name, '/app/storage' is the path inside the container
      - nuxt-storage:/public

    # Optionally restart the container if it stops unexpectedly
    restart: always

   # --- 2. Python Backend API Service ---
  md_converter:
    container_name: md_converter
    # Instructs Docker Compose to build the image using the './Dockerfile.python'
    build:
      context: .
      dockerfile: ./python/Dockerfile
    # Exposes port 8000 only internally, so the 'nuxt_app' service can access it.
    expose:
      - "8000"

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    # IMPORTANT: Define the command to start your Python server.
    # This example assumes you are running a service (e.g., FastAPI/Uvicorn) 
    # and have an entry file named 'app.py' with an application instance named 'app'.
    # command: uvicorn app:app --host 0.0.0.0 --port 8090
    
    # If you need to access the API directly from your host machine (e.g., for testing):
    # ports:
    #   - "8000:8000"
    
    restart: always

# Define the named volumes outside the service block
volumes:
  nuxt-storage:
    # Use 'local' driver for local machine, which is the default
    driver: local